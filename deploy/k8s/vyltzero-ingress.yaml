# vyltzero edge Ingress (Traefik / k3s)
#
# Replaces the in-cluster OpenResty gateway (gateway.enabled=false) with a
# native k8s Ingress. Path map is derived from the ACTUAL axum route
# registrations in services/*/src (verified 2026-07-13), not just the old
# gateway/conf.d/main.conf — axum matches routes EXACTLY (no prefix fallthrough
# like nginx `location`), so only prefixes a backend really serves are listed.
#
# TLS terminates with the vyltzero-gateway-tls cert (self-signed; SANs cover
# both vault.workstation.co.uk and vyltzero.workstation.co.uk). Clients hitting
# the node IP directly, or without the CA trusted, must use `curl -k`.
#
# NOTE: this bypasses the gateway's lua auth/rate-limit/quota middleware and the
# X-Gateway-Secret stamping. Backends run with VAULT_GATEWAY_SECRET unset, which
# makes the shared-secret check a documented no-op (see policy-engine
# src/main.rs), so they accept Traefik's unstamped requests directly.
#
# Routes intentionally NOT exposed here (backend serves no HTTP under them):
#   /v1/identity  -> identity-service registers no such route
#   /v1/audit     -> audit-service  API is gRPC-only (:50056); HTTP :8085 = /health
# Re-add them here only once those services expose the corresponding HTTP routes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vyltzero
  namespace: vyltzero
  labels:
    app.kubernetes.io/name: vyltzero
    app.kubernetes.io/part-of: vyltzero
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - secretName: vyltzero-gateway-tls
      hosts:
        - vault.workstation.co.uk
        - vyltzero.workstation.co.uk
  rules:
    - host: vault.workstation.co.uk
      http:
        paths:
          # --- Health (unauthenticated) — routed to secret-engine's liveness/
          #     readiness so basic health checks work through the edge. `/` has
          #     no owner by design (the gateway that served it is disabled), so
          #     the bare host still 404s; use these instead.
          - path: /healthz
            pathType: Prefix
            backend: { service: { name: vyltzero-secret-engine, port: { number: 8081 } } }
          - path: /readyz
            pathType: Prefix
            backend: { service: { name: vyltzero-secret-engine, port: { number: 8081 } } }
          # --- identity-service (8082) ---
          - path: /v1/auth
            pathType: Prefix
            backend: { service: { name: vyltzero-identity-service, port: { number: 8082 } } }
          - path: /v1/tenants
            pathType: Prefix
            backend: { service: { name: vyltzero-identity-service, port: { number: 8082 } } }
          - path: /v1/api-keys
            pathType: Prefix
            backend: { service: { name: vyltzero-identity-service, port: { number: 8082 } } }
          - path: /v1/quotas
            pathType: Prefix
            backend: { service: { name: vyltzero-identity-service, port: { number: 8082 } } }
          - path: /scim
            pathType: Prefix
            backend: { service: { name: vyltzero-identity-service, port: { number: 8082 } } }
          # --- secret-engine (8081) ---
          - path: /v1/secret
            pathType: Prefix
            backend: { service: { name: vyltzero-secret-engine, port: { number: 8081 } } }
          # HashiCorp Vault KV v2 compatibility mount (services/secret-engine/src/kv2.rs).
          # This is what the External Secrets Operator talks to: `path: kv` in
          # its SecretStore maps to GET/POST /v1/kv/data/<path>.
          - path: /v1/kv
            pathType: Prefix
            backend: { service: { name: vyltzero-secret-engine, port: { number: 8081 } } }
          # Vault clients probe token self-lookup before use. MUST remain a
          # longer prefix than /v1/auth above (identity-service) so Traefik's
          # more-specific match sends only this to the secret-engine.
          - path: /v1/auth/token
            pathType: Prefix
            backend: { service: { name: vyltzero-secret-engine, port: { number: 8081 } } }
          # Vault-shaped health at /v1/sys/health.
          - path: /v1/sys
            pathType: Prefix
            backend: { service: { name: vyltzero-secret-engine, port: { number: 8081 } } }
          # --- transit-engine (8086) ---
          - path: /v1/transit
            pathType: Prefix
            backend: { service: { name: vyltzero-transit-engine, port: { number: 8086 } } }
          # --- policy-engine (8083) ---
          - path: /v1/policies
            pathType: Prefix
            backend: { service: { name: vyltzero-policy-engine, port: { number: 8083 } } }
          # --- pki-engine (8088) ---
          - path: /v1/pki
            pathType: Prefix
            backend: { service: { name: vyltzero-pki-engine, port: { number: 8088 } } }
          # --- mcp-server (8087) ---
          - path: /v1/mcp
            pathType: Prefix
            backend: { service: { name: vyltzero-mcp-server, port: { number: 8087 } } }
          - path: /v1/leases
            pathType: Prefix
            backend: { service: { name: vyltzero-lease-manager, port: { number: 8084 } } }
---
# HTTP -> HTTPS redirect. Encoded explicitly so the repo is self-sufficient and
# does not depend on any cluster-global Traefik entrypoint redirect. Traefik's
# redirectScheme middleware issues a 308 preserving host+path; the backend on
# this port-80 router is never actually reached (the middleware short-circuits),
# but Ingress requires one, so we point it at any always-present service.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: vyltzero
  labels:
    app.kubernetes.io/name: vyltzero
    app.kubernetes.io/part-of: vyltzero
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vyltzero-http-redirect
  namespace: vyltzero
  labels:
    app.kubernetes.io/name: vyltzero
    app.kubernetes.io/part-of: vyltzero
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: vyltzero-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: vault.workstation.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: vyltzero-secret-engine, port: { number: 8081 } } }
    - host: vyltzero.workstation.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: vyltzero-secret-engine, port: { number: 8081 } } }
---
# Allow the Traefik ingress controller (kube-system) to reach vyltzero service
# HTTP ports. Required because the chart's default-deny NetworkPolicy only
# permits in-namespace (part-of: vyltzero) and gateway traffic; with the gateway
# disabled, Traefik is the new edge and must be explicitly allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vyltzero-allow-traefik-ingress
  namespace: vyltzero
  labels:
    app.kubernetes.io/name: vyltzero
    app.kubernetes.io/part-of: vyltzero
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: vyltzero
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { port: 8081, protocol: TCP }
        - { port: 8082, protocol: TCP }
        - { port: 8083, protocol: TCP }
        - { port: 8084, protocol: TCP }
        - { port: 8085, protocol: TCP }
        - { port: 8086, protocol: TCP }
        - { port: 8087, protocol: TCP }
        - { port: 8088, protocol: TCP }
