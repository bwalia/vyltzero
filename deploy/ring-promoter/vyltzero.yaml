# Ring Promoter app — VYLTZERO on k3s1, four rings: int → test → acc → prod.
#
# The "GitHub workflows + Ring Promoter" combo:
#   1. .github/workflows/ci.yml (GitHub-hosted) tests, builds every image,
#      pushes them to GHCR + Docker Hub, cuts the vX.Y.Z tag, then seeds this
#      app's `int` ring with that tag (job `seed-ring-promoter`).
#   2. Ring Promoter runs the k8sjob below IN-CLUSTER for each ring: clone the
#      tag, `helm upgrade --install` into vyltzero-<env>, then health-check the
#      public /api/version until it reports the seeded tag.
#   3. int and test auto-promote; acc → prod is a deliberate human promote in
#      https://rp.workstation.co.uk/?app=vyltzero.
#   4. Each ring host is NS-delegated to ns1/ns2.nebuladns.net with lon1 <-> lon2
#      DNS failover; WSLProxy vhosts live on cp.pop0.uk (see README.md).
#
# The k8sjob deployer (not github) is deliberate: the k3s API is LAN-only and
# this repo has no self-hosted runner, so the cluster deploys itself.
#
# One-time bootstrap: see deploy/ring-promoter/README.md.
apps:
  - name: vyltzero
    display_name: "VYLTZERO — the vault for AI agents"
    location: { lat: 53.4808, lng: -2.2426, city: Manchester, region: GB }
    deployer: k8sjob
    k8sjob:
      namespace: ring-exec
      image: docker.io/dtzar/helm-kubectl:3.15.4
      service_account: ring-deploy-job
      # CNI overlay egress to github.com is flaky on some nodes; hostNetwork
      # uses the node's own path (same as jobshout / wslvault).
      host_network: true
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          env="${RP_TARGET_ENV}"
          ver="${RP_VERSION}"
          case "${env}" in
            int|test|acc|prod) ns="vyltzero-${env}" ;;
            *) echo "unknown RP_TARGET_ENV=${env} (expected int|test|acc|prod)"; exit 1 ;;
          esac
          echo "deploy vyltzero ${ver} -> ns ${ns} (ring ${RP_RING})"
          rm -rf /src
          n=0
          until git clone --depth 1 --branch "${ver}" https://github.com/bwalia/vyltzero /src; do
            n=$((n+1))
            if [ "$n" -ge 5 ]; then exit 1; fi
            echo "git clone failed (attempt $n), retrying..."
            sleep $((n*5))
          done
          cd /src/deploy/helm/vyltzero
          # Refuse to deploy into a ring that was never bootstrapped: without
          # these Secrets the pods crash-loop and helm --wait burns 15 minutes.
          for s in vyltzero-mesh-keys vyltzero-db-auth; do
            kubectl -n "${ns}" get secret "${s}" >/dev/null \
              || { echo "missing Secret ${ns}/${s} — run scripts/vyltzero-env-bootstrap.sh ${env}"; exit 1; }
          done
          # Ring values never pin per-service tags, so global.imageTag moves
          # every service together. No --create-namespace: the ring-deploy-job
          # SA has no cluster-scoped rights; bootstrap creates the namespace.
          helm upgrade --install vyltzero . \
            --namespace "${ns}" \
            -f values-k3s1.yaml \
            -f "values-${env}.yaml" \
            --set global.imageTag="${ver}" \
            --wait --timeout 15m
          echo "vyltzero ${ver} live in ${ns}"
      resources: { cpu_request: 100m, memory_limit: 512Mi }
      timeout: 20m
      retries: 0
      ttl_after_finished: 1h
    rings:
      int:
        target_env: int
        display_name: "int · int.vyltzero.com"
        health_url: "https://int.vyltzero.com/api/version"
        health_version_field: version
        auto_promote: true
        links: [ { label: "VyltZero int", url: "https://int.vyltzero.com/" } ]
      test:
        target_env: test
        display_name: "test · test.vyltzero.com"
        health_url: "https://test.vyltzero.com/api/version"
        health_version_field: version
        auto_promote: true
        links: [ { label: "VyltZero test", url: "https://test.vyltzero.com/" } ]
      # acc -> prod is a human decision: auto_promote stops here.
      acc:
        target_env: acc
        display_name: "acc · acc.vyltzero.com"
        health_url: "https://acc.vyltzero.com/api/version"
        health_version_field: version
        auto_promote: false
        links: [ { label: "VyltZero acc", url: "https://acc.vyltzero.com/" } ]
      prod:
        target_env: prod
        display_name: "prod · app.vyltzero.com"
        health_url: "https://app.vyltzero.com/api/version"
        health_version_field: version
        auto_promote: false
        links: [ { label: "VyltZero", url: "https://app.vyltzero.com/" } ]
