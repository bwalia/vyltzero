# RBAC so Ring Promoter's k8sjob runner can helm-deploy VYLTZERO on k3s1.
#
# Apply against k3s1 (once; scripts/vyltzero-env-bootstrap.sh does this too):
#   export KUBECONFIG=~/.kube/k3s1.yaml
#   kubectl apply -f deploy/ring-promoter/rbac.yaml
#
# Assumes the shared platform already exists (owned by ring-promoter, not
# this file): namespace ring-exec and ServiceAccount ring-exec/ring-deploy-job.
#
# Grants namespaced helm-deploy rights in the four ring namespaces
# vyltzero-{int,test,acc,prod}. The namespaces themselves are created by
# scripts/vyltzero-env-bootstrap.sh, so they must exist before this applies.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rp-deploy-vyltzero
  labels:
    app.kubernetes.io/part-of: vyltzero
    app.kubernetes.io/managed-by: ring-promoter
rules:
  - apiGroups: [""]
    resources:
      - services
      - configmaps
      - secrets
      - serviceaccounts
      - pods
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # edgeIngress Middleware (traefik-edge)
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rp-deploy-vyltzero
  namespace: vyltzero-int
  labels:
    app.kubernetes.io/part-of: vyltzero
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-vyltzero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rp-deploy-vyltzero
  namespace: vyltzero-test
  labels:
    app.kubernetes.io/part-of: vyltzero
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-vyltzero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rp-deploy-vyltzero
  namespace: vyltzero-acc
  labels:
    app.kubernetes.io/part-of: vyltzero
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-vyltzero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rp-deploy-vyltzero
  namespace: vyltzero-prod
  labels:
    app.kubernetes.io/part-of: vyltzero
subjects:
  - kind: ServiceAccount
    name: ring-deploy-job
    namespace: ring-exec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rp-deploy-vyltzero
