{{- if .Values.regionHealth.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vyltzero.componentFullname" (dict "component" "region-health" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vyltzero.componentLabels" (dict "component" "region-health" "componentType" "replication" "context" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vyltzero.componentSelectorLabels" (dict "component" "region-health" "context" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.regionHealth.httpPort }}
      targetPort: http
      protocol: TCP
{{- end }}
